<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balai Gadang Dalam Angka</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--ink:#17352e;--muted:#71817a;--green:#176b50;--green2:#e7f2ec;--line:#e5ece7;--paper:#f6f8f5;--gold:#d8a84e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}
.top{background:#103e32;color:#fff;padding:12px max(22px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px}
.top span{opacity:.82}.wrap{max-width:1180px;margin:auto;padding:0 22px}
header{background:linear-gradient(120deg,#164d3d,#1c7555);color:#fff;padding:34px 0 30px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{width:42px;height:42px;border:1px solid #ffffff65;border-radius:13px;display:grid;place-items:center;font-size:22px}
.brand b{font:700 15px Manrope}.brand small{display:block;color:#c9e0d4;font-size:11px;margin-top:2px}
h1{font:800 clamp(30px,5vw,48px) Manrope;margin:0;letter-spacing:-1.5px}.lead{color:#d5e8de;max-width:650px;line-height:1.7;margin:12px 0 0;font-size:14px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.chip{border:1px solid #ffffff45;padding:7px 11px;border-radius:30px;font-size:11px;color:#e7f3ec}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.navin{display:flex;gap:6px;overflow:auto;padding-top:10px;padding-bottom:10px}
nav a{color:#5e7068;text-decoration:none;padding:10px 13px;border-radius:9px;white-space:nowrap;font-size:12px;font-weight:600}nav a.active,nav a:hover{background:var(--green2);color:var(--green)}
html{scroll-behavior:smooth;scroll-padding-top:76px}section[id],.section-head[id]{scroll-margin-top:76px}
main{padding:26px 0 56px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:26px 0 14px}
h2{font:800 20px Manrope;margin:0;letter-spacing:-.4px}.sub{color:var(--muted);font-size:12px;margin-top:5px}
.year{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;color:var(--ink);font:600 12px "DM Sans"}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}
.metric-label{font-size:11px;color:var(--muted);font-weight:600}.metric{font:800 27px Manrope;margin:10px 0 3px;letter-spacing:-1px}.metric-note{font-size:10px;color:#8a9991}
.metric-icon{float:right;width:33px;height:33px;border-radius:10px;background:var(--green2);display:grid;place-items:center;color:var(--green);font-size:16px}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.placeholder{height:190px;border:1px dashed #cbd9d0;border-radius:12px;display:grid;place-items:center;text-align:center;color:#84938b;font-size:12px;padding:20px;line-height:1.6}
#bg-map{height:520px;width:100%;border-radius:12px;z-index:1}.map-status{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:#5e7068}.legend-line{display:inline-block;width:20px;height:3px;background:#176b50;vertical-align:middle;margin-right:6px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:11px}th{background:#f7faf7;color:#66786e;font-weight:700}td{color:#304a40}
.status{display:inline-block;background:#edf5ef;color:#337554;padding:4px 8px;border-radius:20px;font-size:10px}
.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;background:var(--green);color:#fff;padding:10px 14px;border-radius:9px;font-weight:700;font-size:11px;cursor:pointer}.btn.secondary{background:#edf4ef;color:var(--green);border:1px solid #d8e6dc}
.note{border-left:3px solid var(--gold);background:#fff9ec;padding:12px 14px;border-radius:0 9px 9px 0;color:#79633b;font-size:11px;line-height:1.6}
footer{background:#103e32;color:#d9e9e0;padding:25px 0;font-size:11px}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.muted{color:var(--muted)}#connection{font-size:10px;color:#d4e9dd}
.official-slider{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:12px;align-items:center}
.official-frame{background:#f8faf8;border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:minmax(130px,220px) 1fr;gap:20px;align-items:center;min-height:260px}
.official-frame img{width:100%;height:230px;object-fit:cover;object-position:center 20%;border-radius:12px;background:#e9efeb}
.official-name{font:800 20px Manrope;margin:0 0 7px}.official-role{color:var(--green);font-weight:700;font-size:13px}.official-note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:12px}
.slider-btn{border:1px solid var(--line);background:#fff;border-radius:50%;width:40px;height:40px;font-size:22px;color:var(--green);cursor:pointer}
.slider-dots{display:flex;justify-content:center;gap:7px;margin-top:14px}.slider-dot{width:8px;height:8px;border:0;border-radius:50%;background:#cbd8d0;padding:0}.slider-dot.active{background:var(--green);width:22px;border-radius:9px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{padding-left:18px;padding-right:18px}}
@media(max-width:560px){.official-frame{grid-template-columns:1fr;text-align:center}.official-frame img{height:250px;max-width:230px;margin:auto}.official-slider{grid-template-columns:32px minmax(0,1fr) 32px;gap:5px}.slider-btn{width:30px;height:30px;font-size:18px}.wrap{padding:0 15px}}
@media(max-width:460px){.grid{gap:8px}.card{padding:13px}.metric{font-size:23px}.section-head{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<div class="top"><b>PORTAL DATA KELURAHAN</b><span>Kecamatan Koto Tangah · Kota Padang · Sumatera Barat</span></div>
